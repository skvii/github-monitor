[project]
name = "github-monitor"
version = "0.1.0"
description = "Streamt GitHub-events (Watch, PullRequest, Issues) via een ETL-pipeline naar SQLite en biedt statistieken via een REST API."
authors = [{ name = "Eren Kayadibi" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
github-monitor = "github_monitor.__main__:main"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: basisfouten, I: import-volgorde, UP: moderne syntax, B: veelvoorkomende bugs
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
